name: Windows CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\UninstallMate.sln

      - name: Build
        run: dotnet build .\UninstallMate.sln -c Release --no-restore

      - name: Tests
        run: dotnet run --project .\tests\UninstallMate.LogicTests\UninstallMate.LogicTests.csproj -c Release

      - name: Publish Script
        run: .\scripts\Publish.ps1
        shell: pwsh
